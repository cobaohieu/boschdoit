name: "boschdoit GitHub Action"
description: "Run boschdoit in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the boschdoit session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of BoschDoIt App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/boschdoit,/oc'"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.boschdoit.ai"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get boschdoit version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/cobaohieu/boschdoit/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache boschdoit
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.boschdoit/bin
        key: boschdoit-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install boschdoit
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://smplu.link/boschdoit | bash

    - name: Add boschdoit to PATH
      shell: bash
      run: echo "$HOME/.boschdoit/bin" >> $GITHUB_PATH

    - name: Run boschdoit
      shell: bash
      id: run_boschdoit
      run: boschdoit github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
